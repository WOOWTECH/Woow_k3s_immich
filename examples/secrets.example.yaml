# -----------------------------------------------------------------------------
# Secret for Woow_k3s_immich - PLACEHOLDER ONLY. Never commit a real value.
#
# Used with the default secrets.create=false: the chart only references this
# Secret by name (immich-db-secret) and never renders or overwrites it. Copy
# this file OUTSIDE the repo, replace DB_PASSWORD, then apply that copy:
#   kubectl --context <ctx> apply -f /secure/path/secrets.yaml
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: immich-db-secret
  namespace: immich
  labels:
    app: immich
type: Opaque
stringData:
  # PostgreSQL password for the immich database user below.
  DB_PASSWORD: "REPLACE_ME_PG_PASSWORD"
  # PostgreSQL username used by Immich - only change if you also change it
  # in values.yaml (secrets.dbUsername); not itself sensitive.
  DB_USERNAME: "immich"
  # PostgreSQL database name used by Immich - only change if you also change
  # it in values.yaml (secrets.dbDatabaseName); not itself sensitive.
  DB_DATABASE_NAME: "immich"
