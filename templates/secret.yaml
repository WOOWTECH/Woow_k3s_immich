{{- /*
Secret, rendered only with secrets.create=true. By default (secrets.create=
false) it already exists out of band - created once from
examples/secrets.example.yaml - and the chart never renders or touches it,
so a `helm upgrade` can never overwrite a real password with an empty one.
*/ -}}
{{- if .Values.secrets.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: immich-db-secret
  namespace: {{ include "immich.ns" . }}
  labels:
    app: immich
  {{- include "immich.keepAnnotations" . | nindent 2 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ required "secrets.dbPassword is required when secrets.create=true" .Values.secrets.dbPassword | quote }}
  DB_USERNAME: {{ .Values.secrets.dbUsername | quote }}
  DB_DATABASE_NAME: {{ .Values.secrets.dbDatabaseName | quote }}
{{- end }}
