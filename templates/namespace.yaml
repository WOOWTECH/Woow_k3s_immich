{{- /*
Namespace. One equal to the release namespace (`-n`) is never rendered:
Helm keeps its release record there, so create it with --create-namespace
instead - that way `helm uninstall` can never delete the namespace the
release itself lives in.
*/ -}}
{{- if and .Values.namespace.create (ne .Values.namespace.name .Release.Namespace) }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace.name }}
  labels:
    app: immich
    managed-by: helm
  {{- include "immich.keepAnnotations" . | nindent 2 }}
{{- end }}
