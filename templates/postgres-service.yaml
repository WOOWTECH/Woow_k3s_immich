{{- if .Values.postgres.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: immich-postgres
  namespace: {{ include "immich.ns" . }}
  labels:
    app: immich
    component: postgres
spec:
  type: {{ .Values.postgres.service.type }}
  selector:
    app: immich
    component: postgres
  ports:
    - port: {{ .Values.postgres.service.port }}
      targetPort: 5432
      protocol: TCP
{{- end }}
