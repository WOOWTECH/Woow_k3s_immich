{{- if .Values.machineLearning.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: immich-machine-learning
  namespace: {{ include "immich.ns" . }}
  labels:
    app: immich
    component: machine-learning
spec:
  type: {{ .Values.machineLearning.service.type }}
  selector:
    app: immich
    component: machine-learning
  ports:
    - port: {{ .Values.machineLearning.service.port }}
      targetPort: 3003
      protocol: TCP
{{- end }}
