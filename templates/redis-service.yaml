{{- if .Values.redis.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: immich-redis
  namespace: {{ .Values.namespace.name }}
  labels:
    app: immich
    component: redis
spec:
  type: {{ .Values.redis.service.type }}
  selector:
    app: immich
    component: redis
  ports:
    - port: {{ .Values.redis.service.port }}
      targetPort: 6379
      protocol: TCP
{{- end }}
